<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTT</title>
    <link rel="stylesheet" href="style.css">

</head>
<script src="script.js" defer></script>
<body>
    <div class="container">
        <h1>TIC TAC TOE GAME</h1>
    <div class="row">
      <div id="box0" class="box" data-iubox="0"></div>
      <div id="box1" class="box" data-iubox="1"></div>
      <div id="box2" class="box" data-iubox="2"></div>
      <div id="box3" class="box" data-iubox="3"></div>
      <div id="box4" class="box" data-iubox="4"></div>
      <div id="box5" class="box" data-iubox="5"></div>
      <div id="box6" class="box" data-iubox="6"></div>
      <div id="box7" class="box" data-iubox="7"></div>
      <div id="box8" class="box" data-iubox="8"></div>
     </div>            
    </div>
    
   <div class="bottom-content">
    <h1>Status & Score</h1>
    <h2>Turn: <span id="status">Player X</span> </h2>
    <h2 >Player X: <span id="p1score"></span> </h2>
    <h2 >Player O: <span id="p2score"></span> </h2>
    <p><span id="outcome"></span> </p>
    <button id="resetbtn">RESET</button>
   </div>
   



</body>
</html>
